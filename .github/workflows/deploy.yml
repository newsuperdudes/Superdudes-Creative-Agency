name: Deploy to FTP
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      # Copies site images onto our hosting. Never blocks the deploy: on
      # failure the site keeps loading them from R2.
      - run: node scripts/mirror-assets.mjs
        continue-on-error: true
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_UPLOAD_ENDPOINT: ${{ secrets.VITE_UPLOAD_ENDPOINT }}
          # No service key and no upload token: every VITE_ value ends up in
          # the public bundle. Uploads are authorised with the signed-in
          # editor's own access token instead.
      # Static text snapshot for AI crawlers (they don't run JS). Never blocks
      # the deploy: on failure dist/index.html stays exactly as built.
      - run: npm run prerender
        continue-on-error: true
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/
          local-dir: ./dist/
